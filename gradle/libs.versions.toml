[versions]
kotlin = "2.3.0"
spring-boot = "4.0.1"
spring-dependency-management = "1.1.7"
kotlin-logging-jvm = "7.0.13"
kotest = "6.0.2"
kotest-extensions-spring = "1.1.3"
kotest-extensions-testcontainers = "2.0.2"
jmolecules = "2.0.1"
testcontainers = "2.0.3"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-all-open = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging-jvm" }

kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
kotest-extensions-testcontainers = { module = "io.kotest:kotest-extensions-testcontainers", version.ref = "kotest" }
jmolecules-ddd = { module = "org.jmolecules:jmolecules-ddd", version.ref = "jmolecules" }
jmolecules-events = { module = "org.jmolecules:jmolecules-events", version.ref = "jmolecules" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter"}
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }

[bundles]
kotest = ["kotest-framework-engine", "kotest-runner-junit5", "kotest-assertions-core", "kotest-property"]
jmolecules = ["jmolecules-ddd", "jmolecules-events"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
kotlin-plugin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
